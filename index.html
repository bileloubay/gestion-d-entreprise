<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Cours/style.css">
    <style>
        .card{
            all: unset;
            cursor: pointer;
            position: relative;
            border: 2px solid var(--card);
            padding: 10px 10px 20px;
            max-width: 300px;
            margin: 10px;

            background-color: var(--card-bg);
            border-radius: 25px;
            text-align: center;
        }
    </style>
</head>
<body>
    <titre>Gestion d'Entreprise</titre>
    <card-container></card-container>
    
    <script>
        const iframe = 
        cardCont = document.querySelector("card-container");
        const courses = {
            "01": {"label" : "Introduction à la Gestion", "desc" : "Découvrir les principes fondamentaux de la gestion, ces objectifs et ses quatre fonctions essentielles." },
            "02": {"label" : "L'Entreprise : Visions et Rôles", "desc" : "Comprendre les différentes visions de l'entreprise, son fonctionnement et ses rôles." },
        }
        for (const cours of Object.entries(courses)) {
            console.log(cours);
            
            cardCont.innerHTML += `
                <a class="card" target="_self" href='Cours/Chapitre ${cours[0]}.html'">
                    <card-number>${cours[0]}</card-number>
                    <card-title>${cours[1].label}</card-title>
                    <card-content>${cours[1].desc}</card-content>
                </a>
            `
            
        }


    </script>
</body>
</html>
